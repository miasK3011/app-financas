<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --color-primary: #2E6F55;
      --color-primary-dark: #234F3E;
      --color-primary-light: #E4F0EA;
      --color-success: #3C8A5B;
      --color-success-dark: #306E49;
      --color-success-bg: #E7F4EC;
      --color-error: #C74A3C;
      --color-error-dark: #9E3A2F;
      --color-error-bg: #FBEAE7;
      --color-info: #2F6FB0;
      --color-info-dark: #285E96;
      --color-info-bg: #E5EEF7;
      --color-neutral-fill: #B9B7B2;
      --color-bg: #FAFAF9;
      --color-surface: #FFFFFF;
      --color-border: #E7E5E2;
      --color-text: #1C1C1E;
      --color-text-secondary: #5B5B5E;
      --color-text-tertiary: #6C6C6D;
      --radius-lg: 20px;
      --radius-md: 14px;
    }
    body { margin: 0; }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: var(--color-primary-dark); }
    .screen {
      position: relative;
      width: 412px;
      height: 915px;
      overflow: hidden;
      background: var(--color-bg);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .content { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 24px 20px 36px; }
    .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-tertiary); }

    .top-header-row { display: flex; align-items: center; gap: 12px; }
    .header-title { font-family: 'Lora', Georgia, 'Times New Roman', serif; font-size: 19px; font-weight: 600; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--color-surface); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; color: var(--color-text); flex: 0 0 auto; }
    .icon-btn .icon { width: 18px; height: 18px; }

    .select-field { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 9px 13px; font-family: inherit; background: var(--color-bg); color: var(--color-text); }
    .select-field-left { display: flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 600; }
    .select-icon-wrap { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; background: var(--color-primary-light); color: var(--color-primary-dark); }
    .select-icon-wrap .icon { width: 15px; height: 15px; }
    .select-field .chevron { width: 17px; height: 17px; color: var(--color-text-tertiary); flex: 0 0 auto; }

    .segmented { display: flex; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 999px; padding: 4px; gap: 4px; }
    .segment { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: var(--color-text-secondary); padding: 9px 0; border-radius: 999px; }
    .segment.active { background: var(--color-primary); color: #fff; }

    .dropzone { border: 1.5px dashed var(--color-border); border-radius: var(--radius-md); padding: 18px; display: flex; align-items: center; gap: 12px; }
    .dropzone-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--color-primary-light); color: var(--color-primary-dark); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .dropzone-info { flex: 1; min-width: 0; }
    .dropzone-name { font-size: 14px; font-weight: 600; }
    .dropzone-size { font-size: 12px; color: var(--color-text-tertiary); margin-top: 1px; }
    .dropzone .icon-btn { width: 32px; height: 32px; }
    .dropzone .icon-btn .icon { width: 15px; height: 15px; }

    .primary-btn { width: 100%; background: var(--color-primary); color: #fff; border: none; border-radius: 999px; padding: 15px; font-size: 15px; font-weight: 700; font-family: inherit; }
  </style>
</helmet>

<div class="screen">
  <div class="content">

    <div class="top-header-row">
      <div class="icon-btn">
        <svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
      </div>
      <div class="header-title">Importar Fatura</div>
    </div>

    <div class="card">
      <div class="card-title">Cartão de destino</div>
      <button class="select-field">
        <span class="select-field-left">
          <span class="select-icon-wrap">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
          </span>
          Nubank
        </span>
        <svg class="icon chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <div class="card">
      <div class="card-title">Formato do arquivo</div>
      <div class="segmented">
        <div class="segment">Genérico</div>
        <div class="segment active">Nubank</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Arquivo</div>
      <div class="dropzone">
        <div class="dropzone-icon">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
        </div>
        <div class="dropzone-info">
          <div class="dropzone-name">fatura_setembro.csv</div>
          <div class="dropzone-size">128 KB</div>
        </div>
        <button class="icon-btn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <button class="primary-btn">Importar</button>

  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
