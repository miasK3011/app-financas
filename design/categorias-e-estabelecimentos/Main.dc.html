<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --color-primary: #2E6F55;
      --color-primary-dark: #234F3E;
      --color-primary-light: #E4F0EA;
      --color-success: #3C8A5B;
      --color-success-bg: #E7F4EC;
      --color-error: #C74A3C;
      --color-error-bg: #FBEAE7;
      --color-neutral-fill: #B9B7B2;
      --color-bg: #FAFAF9;
      --color-surface: #FFFFFF;
      --color-border: #E7E5E2;
      --color-text: #1C1C1E;
      --color-text-secondary: #5B5B5E;
      --color-text-tertiary: #6C6C6D;
      --radius-lg: 20px;
      --radius-md: 14px;
    }
    body { margin: 0; }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: var(--color-primary-dark); }
    .screen {
      position: relative;
      width: 412px;
      height: 915px;
      overflow: hidden;
      background: var(--color-bg);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .content { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 28px 20px 110px; }
    .section-title-row { display: flex; align-items: center; justify-content: space-between; }
    .section-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

    .top-header-row { display: flex; align-items: center; gap: 12px; }
    .header-title { font-family: 'Lora', Georgia, 'Times New Roman', serif; font-size: 19px; font-weight: 600; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--color-surface); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; color: var(--color-text); flex: 0 0 auto; }
    .icon-btn .icon { width: 18px; height: 18px; }

    .list-card { display: flex; flex-direction: column; }
    .list-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--color-border); }
    .list-row:last-child { border-bottom: none; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .avatar .icon { width: 18px; height: 18px; }
    .list-info { flex: 1; min-width: 0; }
    .list-name { font-size: 14.5px; font-weight: 600; }
    .list-sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
    .list-row .icon-btn { width: 32px; height: 32px; }
    .list-row .icon-btn .icon { width: 15px; height: 15px; }

    .fab { position: absolute; right: 20px; bottom: 96px; width: 56px; height: 56px; border-radius: 50%; background: var(--color-primary); color: #fff; border: none; box-shadow: 0 6px 16px rgba(46,111,85,0.35); display: flex; align-items: center; justify-content: center; }
    .fab .icon { width: 26px; height: 26px; stroke-width: 2.2; }

    .bottom-tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: var(--color-surface); border-top: 1px solid var(--color-border); display: flex; align-items: flex-start; padding-top: 10px; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--color-text-tertiary); font-size: 11px; font-weight: 500; }
    .tab.active { color: var(--color-primary); }
    .tab .icon { width: 22px; height: 22px; }
  </style>
</helmet>

<div class="screen">
  <div class="content">

    <div class="top-header-row">
      <div class="icon-btn">
        <svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
      </div>
      <div class="header-title">Categorias</div>
    </div>

    <div>
      <div class="section-title-row"><div class="section-title">Pré-definidas</div></div>
      <div class="list-card" style="margin-top: 10px;">
        <div class="list-row">
          <div class="avatar" style="background:#FDEDE3; color:#C9702C;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 3v6a2 2 0 0 0 4 0V3"/><path d="M8 9v12"/><path d="M17 3c-1.1 0-2 1.3-2 4.5S15.9 12 17 12s2-1.3 2-4.5S18.1 3 17 3Z"/><path d="M17 12v9"/></svg>
          </div>
          <div class="list-info"><div class="list-name">Alimentação</div></div>
        </div>
        <div class="list-row">
          <div class="avatar" style="background:#E3EAF7; color:#3E63A6;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16"/><circle cx="7.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="16.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/></svg>
          </div>
          <div class="list-info"><div class="list-name">Transporte</div></div>
        </div>
        <div class="list-row">
          <div class="avatar" style="background:#F1E7F7; color:#7A4FA0;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          </div>
          <div class="list-info"><div class="list-name">Compras</div></div>
        </div>
        <div class="list-row">
          <div class="avatar" style="background:#FBE6E9; color:#B23A55;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h13l-3-3"/><path d="M20 17H7l3 3"/></svg>
          </div>
          <div class="list-info"><div class="list-name">Assinaturas</div></div>
        </div>
        <div class="list-row">
          <div class="avatar" style="background:#E7F4EC; color:#306E49;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a9 9 0 0 0-9 9c0 4.5 5 8.5 9 11 4-2.5 9-6.5 9-11a9 9 0 0 0-9-9Z"/><path d="M9 12h6M12 9v6"/></svg>
          </div>
          <div class="list-info"><div class="list-name">Saúde</div></div>
        </div>
        <div class="list-row">
          <div class="avatar" style="background:#E1F0F3; color:#2C8FA0;">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M16 5v14" stroke-dasharray="2 2"/></svg>
          </div>
          <div class="list-info"><div class="list-name">Lazer</div></div>
        </div>
        <div class="list-row">
          <div class="avatar" style="background:#ECECEA; color:#6B6B6E;">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
          </div>
          <div class="list-info"><div class="list-name">Outros</div></div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title-row"><div class="section-title">Personalizadas</div></div>
      <div class="list-card" style="margin-top: 10px;">
        <div class="list-row">
          <div class="avatar" style="background:#EFEAF9; color:#6E56A8;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 21v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
          </div>
          <div class="list-info">
            <div class="list-name">Pet</div>
            <div class="list-sub">Personalizada</div>
          </div>
          <button class="icon-btn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <button class="fab">
    <svg class="icon" viewBox="0 0 24 24" style="stroke:#fff;"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="bottom-tabs">
    <div class="tab">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>Início</span>
    </div>
    <div class="tab">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
      <span>Cartões</span>
    </div>
    <div class="tab">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h13l-3-3"/><path d="M20 17H7l3 3"/></svg>
      <span>Assinaturas</span>
    </div>
    <div class="tab">
      <svg class="icon" viewBox="0 0 24 24"><path d="m12 3 9 4.5-9 4.5-9-4.5Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
      <span>Reservas</span>
    </div>
    <div class="tab active">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
      <span>Mais</span>
    </div>
  </nav>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
