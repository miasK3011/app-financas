<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --color-primary: #2E6F55;
      --color-primary-dark: #234F3E;
      --color-primary-light: #E4F0EA;
      --color-bg: #FAFAF9;
      --color-surface: #FFFFFF;
      --color-border: #E7E5E2;
      --color-text: #1C1C1E;
      --color-text-secondary: #5B5B5E;
      --color-text-tertiary: #6C6C6D;
      --radius-lg: 20px;
      --radius-md: 14px;
    }
    body { margin: 0; }
    .screen {
      position: relative;
      width: 412px;
      height: 915px;
      overflow: hidden;
      background: var(--color-bg);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .content { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 28px 20px 110px; opacity: 0.5; }
    .section-title-row { display: flex; align-items: center; justify-content: space-between; }
    .section-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

    .top-header-row { display: flex; align-items: center; gap: 12px; }
    .header-title { font-family: 'Lora', Georgia, 'Times New Roman', serif; font-size: 19px; font-weight: 600; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--color-surface); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; color: var(--color-text); flex: 0 0 auto; }
    .icon-btn .icon { width: 18px; height: 18px; }

    .list-card { display: flex; flex-direction: column; }
    .list-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--color-border); }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .avatar .icon { width: 18px; height: 18px; }
    .list-info { flex: 1; min-width: 0; }
    .list-name { font-size: 14.5px; font-weight: 600; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 12.5px; font-weight: 600; color: var(--color-text-secondary); }
    .field-input { width: 100%; box-sizing: border-box; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 11px 13px; font-size: 14.5px; font-family: inherit; color: var(--color-text); background: var(--color-bg); }

    .icon-option-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .icon-option { width: 42px; height: 42px; border-radius: 12px; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; }
    .icon-option.selected { border-color: var(--color-primary); }
    .icon-option .icon { width: 19px; height: 19px; }

    .primary-btn { width: 100%; background: var(--color-primary); color: #fff; border: none; border-radius: 999px; padding: 15px; font-size: 15px; font-weight: 700; font-family: inherit; }

    .scrim { position: absolute; inset: 0; background: rgba(28,28,30,0.45); }
    .drawer { position: absolute; left: 0; right: 0; bottom: 0; max-height: 62%; background: var(--color-surface); border-radius: 24px 24px 0 0; padding: 12px 20px 26px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; }
    .drawer-handle { width: 40px; height: 4px; border-radius: 999px; background: var(--color-border); align-self: center; margin-bottom: 2px; }
    .drawer-title { font-family: 'Lora', Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: 600; }
  </style>
</helmet>

<div class="screen">
  <div class="content">

    <div class="top-header-row">
      <div class="icon-btn">
        <svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
      </div>
      <div class="header-title">Categorias</div>
    </div>

    <div>
      <div class="section-title-row"><div class="section-title">Pré-definidas</div></div>
      <div class="list-card" style="margin-top: 10px;">
        <div class="list-row">
          <div class="avatar" style="background:#FDEDE3; color:#C9702C;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 3v6a2 2 0 0 0 4 0V3"/><path d="M8 9v12"/></svg>
          </div>
          <div class="list-info"><div class="list-name">Alimentação</div></div>
        </div>
        <div class="list-row">
          <div class="avatar" style="background:#E3EAF7; color:#3E63A6;">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16"/></svg>
          </div>
          <div class="list-info"><div class="list-name">Transporte</div></div>
        </div>
      </div>
    </div>

  </div>

  <div class="scrim"></div>
  <div class="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">Nova categoria</div>

    <div class="field">
      <span class="field-label">Nome</span>
      <input class="field-input" value="Pet">
    </div>

    <div class="field">
      <span class="field-label">Ícone</span>
      <div class="icon-option-row">
        <button class="icon-option selected" style="background:#EFEAF9; color:#6E56A8;">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 21v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
        </button>
        <button class="icon-option" style="background:#FDEDE3; color:#C9702C;">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 3v6a2 2 0 0 0 4 0V3"/><path d="M8 9v12"/></svg>
        </button>
        <button class="icon-option" style="background:#E3EAF7; color:#3E63A6;">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16"/></svg>
        </button>
        <button class="icon-option" style="background:#E7F4EC; color:#306E49;">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a9 9 0 0 0-9 9c0 4.5 5 8.5 9 11 4-2.5 9-6.5 9-11a9 9 0 0 0-9-9Z"/></svg>
        </button>
        <button class="icon-option" style="background:#ECECEA; color:#6B6B6E;">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </div>

    <button class="primary-btn">Criar categoria</button>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
