<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap">
  <style>
    * { box-sizing: border-box; }
    :root {
      --color-primary: #2E6F55;
      --color-primary-dark: #234F3E;
      --color-primary-light: #E4F0EA;
      --color-success: #3C8A5B;
      --color-success-dark: #306E49;
      --color-success-bg: #E7F4EC;
      --color-error: #C74A3C;
      --color-error-bg: #FBEAE7;
      --color-neutral-fill: #B9B7B2;
      --color-bg: #FAFAF9;
      --color-surface: #FFFFFF;
      --color-border: #E7E5E2;
      --color-text: #1C1C1E;
      --color-text-secondary: #5B5B5E;
      --color-text-tertiary: #6C6C6D;
      --radius-lg: 20px;
      --radius-md: 14px;
    }
    body { margin: 0; }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: var(--color-primary-dark); }
    .screen {
      position: relative;
      width: 412px;
      height: 915px;
      overflow: hidden;
      background: var(--color-bg);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .content { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 28px 20px 40px; }
    .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }

    .top-header-row { display: flex; align-items: center; gap: 12px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--color-surface); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; color: var(--color-text); flex: 0 0 auto; }
    .icon-btn .icon { width: 18px; height: 18px; }
    .header-title { font-family: 'Lora', Georgia, 'Times New Roman', serif; font-size: 19px; font-weight: 600; }

    .income-card { padding: 22px; display: flex; flex-direction: column; gap: 10px; }
    .income-card-top { display: flex; align-items: center; justify-content: space-between; }
    .income-label { font-size: 13px; color: var(--color-text-secondary); font-weight: 500; }
    .income-card .icon-btn { width: 32px; height: 32px; }
    .income-card .icon-btn .icon { width: 15px; height: 15px; }
    .income-value { font-family: 'Lora', Georgia, 'Times New Roman', serif; font-size: 36px; font-weight: 600; letter-spacing: -0.02em; color: var(--color-primary); }
    .income-breakdown { display: flex; gap: 10px; }
    .income-chip { display: flex; align-items: center; gap: 6px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--color-text-secondary); }
    .income-chip .icon { width: 15px; height: 15px; color: var(--color-text-tertiary); }
    .income-chip.avulsas .icon { color: var(--color-success-dark); }

    .list-card { display: flex; flex-direction: column; }
    .list-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--color-border); }
    .list-row:last-child { border-bottom: none; }
    .list-info { flex: 1; min-width: 0; }
    .list-title-row { display: flex; align-items: center; gap: 8px; }
    .list-name { font-size: 14.5px; font-weight: 600; }
    .list-sub { font-size: 12.5px; color: var(--color-text-tertiary); margin-top: 2px; }

    .badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--color-success-bg); color: var(--color-success-dark); }

    .segmented { display: flex; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 999px; padding: 4px; gap: 4px; }
    .segment { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: var(--color-text-secondary); padding: 9px 0; border-radius: 999px; }
    .segment.active { background: var(--color-primary); color: #fff; }

    .bottom-tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: var(--color-surface); border-top: 1px solid var(--color-border); display: flex; align-items: flex-start; padding-top: 10px; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--color-text-tertiary); font-size: 11px; font-weight: 500; }
    .tab.active { color: var(--color-primary); }
    .tab .icon { width: 22px; height: 22px; }
  </style>
</helmet>

<div class="screen">
  <div class="content">

    <div class="top-header-row">
      <div class="icon-btn">
        <svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
      </div>
      <div class="header-title">Renda &amp; Entradas</div>
    </div>

    <div class="card income-card">
      <div class="income-card-top">
        <div class="income-label">Total de entradas · Setembro 2026</div>
        <button class="icon-btn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
      <div class="income-value">R$ 6.710,00</div>
      <div class="income-breakdown">
        <div class="income-chip">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/><path d="M16 7V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v2"/><path d="M18 13h.01"/></svg>
          R$ 6.200,00
        </div>
        <div class="income-chip avulsas">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          R$ 510,00
        </div>
      </div>
    </div>

    <div class="segmented">
      <div class="segment">Entradas avulsas</div>
      <div class="segment active">Histórico de renda</div>
    </div>

    <div class="list-card">
      <div class="list-row">
        <div class="list-info">
          <div class="list-title-row">
            <span class="list-name">R$ 6.200,00</span>
            <span class="badge">Atual</span>
          </div>
          <div class="list-sub">Desde 01/09/2026</div>
        </div>
      </div>
      <div class="list-row">
        <div class="list-info">
          <div class="list-name">R$ 5.800,00</div>
          <div class="list-sub">01/03/2026 – 31/08/2026</div>
        </div>
      </div>
      <div class="list-row">
        <div class="list-info">
          <div class="list-name">R$ 5.200,00</div>
          <div class="list-sub">até 28/02/2026</div>
        </div>
      </div>
    </div>

  </div>

  <nav class="bottom-tabs">
    <div class="tab active">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>Início</span>
    </div>
    <div class="tab">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
      <span>Cartões</span>
    </div>
    <div class="tab">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h13l-3-3"/><path d="M20 17H7l3 3"/></svg>
      <span>Assinaturas</span>
    </div>
    <div class="tab">
      <svg class="icon" viewBox="0 0 24 24"><path d="m12 3 9 4.5-9 4.5-9-4.5Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
      <span>Reservas</span>
    </div>
    <div class="tab">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
      <span>Mais</span>
    </div>
  </nav>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
